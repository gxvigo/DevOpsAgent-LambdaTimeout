AWSTemplateFormatVersion: '2010-09-09'
Description: 'Quote of the Day - API Gateway and Name Handler Lambda (Account Two)'

Parameters:
  AccountOneQuoteFunctionArn:
    Type: String
    Description: ARN of the GetQuote Lambda function in Account One
    AllowedPattern: '^arn:aws:lambda:[a-z0-9-]+:\d{12}:function:[a-zA-Z0-9-_]+$'
  
  DeploymentVersion:
    Type: String
    Description: Version number to force API Gateway redeployment
    Default: 'v3'

Resources:
  # Lambda Execution Role
  NameHandlerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeCrossAccountLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Ref AccountOneQuoteFunctionArn

  # Lambda Execution Role for DevOps Agent Trigger
  DevOpsAgentTriggerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda Function
  NameHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: NameHandlerFunction
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt NameHandlerLambdaExecutionRole.Arn
      Timeout: 5
      Environment:
        Variables:
          QUOTE_FUNCTION_ARN: !Ref AccountOneQuoteFunctionArn
          TIMEOUT: '0'
      Tags:
        - Key: application_id
          Value: myapi
      Code:
        ZipFile: |
          import json
          import random
          import boto3
          import os
          import time
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          lambda_client = boto3.client('lambda')
          quote_function_arn = os.environ['QUOTE_FUNCTION_ARN']
          sleep_time = int(os.environ.get('TIMEOUT', '0'))
          
          def lambda_handler(event, context):
              # Get name from query parameters
              query_params = event.get('queryStringParameters', {})
              name = query_params.get('name', 'Friend') if query_params else 'Friend'
              
              logger.info(f"Lambda invoked with name: {name}")
              logger.info(f"Sleep time configured: {sleep_time} seconds")
              
              # Simulate timeout if TIMEOUT environment variable is set
              if sleep_time > 0:
                  logger.warning(f"Sleeping for {sleep_time} seconds (may cause timeout)")
                  time.sleep(sleep_time)
              
              # Generate random number between 1 and 10
              random_number = random.randint(1, 10)
              logger.info(f"Generated random number: {random_number}")
              
              try:
                  # Invoke the GetQuote Lambda in Account One
                  response = lambda_client.invoke(
                      FunctionName=quote_function_arn,
                      InvocationType='RequestResponse',
                      Payload=json.dumps({'number': random_number})
                  )
                  
                  # Parse the response
                  response_payload = json.loads(response['Payload'].read())
                  logger.info(f"Response from GetQuote function: {response_payload}")
                  
                  if response_payload.get('statusCode') == 200:
                      body = json.loads(response_payload['body'])
                      quote = body.get('quote', 'No quote available')
                      
                      # Combine name and quote
                      message = f"Hello {name}. This is your quote for today: {quote}"
                      
                      logger.info(f"Successfully generated message: {message}")
                      
                      return {
                          'statusCode': 200,
                          'headers': {
                              'Content-Type': 'application/json'
                          },
                          'body': json.dumps({
                              'message': message,
                              'quote_number': random_number
                          })
                      }
                  else:
                      logger.error(f"Error from GetQuote function: {response_payload}")
                      return {
                          'statusCode': 500,
                          'body': json.dumps({'error': 'Failed to retrieve quote'})
                      }
              
              except Exception as e:
                  logger.error(f"Error invoking GetQuote function: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': f'Failed to get quote: {str(e)}'})
                  }

  # Lambda Function to trigger DevOps Agent Investigation
  DevOpsAgentTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: DevOpsAgentTriggerFunction
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt DevOpsAgentTriggerLambdaExecutionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          WEBHOOK_URL: 'https://event-ai.us-east-1.api.aws/webhook/generic/3866825c-204c-4cbc-bbba-f6a8956c2b8a'
          WEBHOOK_SECRET: 'QbLZgN6pqdztHlevk0PS5ta5VOe4u6YE+wjkFl/E+U8='
      Tags:
        - Key: application_id
          Value: myapi
      Code:
        ZipFile: |
          const crypto = require('crypto');
          
          const webhookUrl = process.env.WEBHOOK_URL;
          const secret = process.env.WEBHOOK_SECRET;
          
          exports.handler = async (event) => {
              console.log('Event received:', JSON.stringify(event));
              
              let incidentData;
              
              // Check if this is a CloudWatch Alarm event
              if (event.AlarmName || event.AlarmArn) {
                  console.log('CloudWatch Alarm event detected');
                  incidentData = {
                      incidentId: `ALARM-${event.AlarmName}-${Date.now()}`,
                      action: event.NewStateValue === 'ALARM' ? 'created' : 'resolved',
                      priority: 'HIGH',
                      title: `CloudWatch Alarm: ${event.AlarmName}`,
                      description: event.NewStateReason || event.AlarmDescription || 'CloudWatch alarm triggered',
                      service: 'quote-of-day',
                      data: {
                          alarmName: event.AlarmName,
                          alarmArn: event.AlarmArn,
                          oldState: event.OldStateValue,
                          newState: event.NewStateValue,
                          reason: event.NewStateReason,
                          timestamp: event.StateChangeTime
                      }
                  };
              }
              // Check if this is an API Gateway event
              else if (event.body) {
                  console.log('API Gateway event detected');
                  incidentData = typeof event.body === 'string' ? JSON.parse(event.body) : event.body;
              }
              // Direct Lambda invocation
              else {
                  console.log('Direct invocation event detected');
                  incidentData = event;
              }
              
              // Build the payload according to DevOps Agent schema
              const payload = {
                  eventType: 'incident',
                  incidentId: incidentData.incidentId || `INC-${Date.now()}`,
                  action: incidentData.action || 'created',
                  priority: incidentData.priority || 'HIGH',
                  title: incidentData.title || 'Quote of the Day Service Issue',
                  description: incidentData.description || 'An incident has been detected in the Quote of the Day service',
                  timestamp: new Date().toISOString(),
                  service: incidentData.service || 'quote-of-day',
                  data: incidentData.data || {}
              };
              
              console.log('Payload to send:', JSON.stringify(payload));
              
              // Create HMAC signature
              const timestamp = new Date().toISOString();
              const hmac = crypto.createHmac('sha256', secret);
              hmac.update(`${timestamp}:${JSON.stringify(payload)}`, 'utf8');
              const signature = hmac.digest('base64');
              
              console.log('Timestamp:', timestamp);
              console.log('Signature:', signature);
              
              try {
                  // Send to webhook
                  const response = await fetch(webhookUrl, {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json',
                          'x-amzn-event-timestamp': timestamp,
                          'x-amzn-event-signature': signature
                      },
                      body: JSON.stringify(payload)
                  });
                  
                  const responseText = await response.text();
                  console.log('Webhook response status:', response.status);
                  console.log('Webhook response:', responseText);
                  
                  if (!response.ok) {
                      throw new Error(`Webhook returned status ${response.status}: ${responseText}`);
                  }
                  
                  return {
                      statusCode: 200,
                      headers: {
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                          message: 'DevOps Agent investigation triggered successfully',
                          incidentId: payload.incidentId,
                          webhookStatus: response.status
                      })
                  };
              } catch (error) {
                  console.error('Error sending to webhook:', error);
                  return {
                      statusCode: 500,
                      body: JSON.stringify({
                          error: 'Failed to trigger DevOps Agent investigation',
                          details: error.message
                      })
                  };
              }
          };

  # Lambda Permission for API Gateway to invoke DevOps Agent Trigger
  DevOpsAgentTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DevOpsAgentTriggerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${QuoteApi}/*/*

  # Lambda Permission for API Gateway
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NameHandlerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${QuoteApi}/*/*

  # API Gateway REST API
  QuoteApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: QuoteOfTheDayAPI
      Description: API that returns personalized quote of the day
      Tags:
        - Key: application_id
          Value: myapi

  # API Gateway Resource
  QuoteResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref QuoteApi
      ParentId: !GetAtt QuoteApi.RootResourceId
      PathPart: quote

  # API Gateway Resource for DevOps Agent Trigger
  TriggerResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref QuoteApi
      ParentId: !GetAtt QuoteApi.RootResourceId
      PathPart: trigger-investigation

  # API Gateway Method
  QuoteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref QuoteApi
      ResourceId: !Ref QuoteResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NameHandlerFunction.Arn}/invocations

  # API Gateway Method for DevOps Agent Trigger
  TriggerMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref QuoteApi
      ResourceId: !Ref TriggerResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DevOpsAgentTriggerFunction.Arn}/invocations

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: 
      - QuoteMethod
      - TriggerMethod
    Properties:
      RestApiId: !Ref QuoteApi
      StageName: prod
      Description: !Sub 'Deployment ${DeploymentVersion}'
      StageDescription:
        Description: !Sub 'Stage ${DeploymentVersion}'
        Tags:
          - Key: application_id
            Value: myapi
          - Key: deployment_version
            Value: !Ref DeploymentVersion

  # CloudWatch Alarm for Lambda Errors
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: NameHandlerLambdaErrorAlarm
      AlarmDescription: Triggers when Lambda has more than 3 errors in 1 minute
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref NameHandlerFunction
      TreatMissingData: notBreaching
      AlarmActions:
        - !GetAtt DevOpsAgentTriggerFunction.Arn
      Tags:
        - Key: application_id
          Value: myapi

  # Lambda Permission for CloudWatch Alarm to invoke DevOps Agent Trigger
  AlarmInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DevOpsAgentTriggerFunction
      Action: lambda:InvokeFunction
      Principal: lambda.alarms.cloudwatch.amazonaws.com
      SourceArn: !GetAtt LambdaErrorAlarm.Arn

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${QuoteApi}.execute-api.${AWS::Region}.amazonaws.com/prod/quote
  
  TriggerInvestigationEndpoint:
    Description: API Gateway endpoint to trigger DevOps Agent investigation
    Value: !Sub https://${QuoteApi}.execute-api.${AWS::Region}.amazonaws.com/prod/trigger-investigation
  
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref NameHandlerFunction
  
  DevOpsAgentTriggerFunctionName:
    Description: DevOps Agent Trigger Lambda function name
    Value: !Ref DevOpsAgentTriggerFunction
  
  AlarmName:
    Description: CloudWatch alarm name
    Value: !Ref LambdaErrorAlarm
