AWSTemplateFormatVersion: '2010-09-09'
Description: 'Quote of the Day - DynamoDB and Quote Retrieval Lambda (Account One)'

Parameters:
  AccountTwoId:
    Type: String
    Description: AWS Account ID of Account Two (for cross-account Lambda invocation)
    AllowedPattern: '^\d{12}$'
  
  QuotesTableName:
    Type: String
    Description: Name of the DynamoDB table for quotes
    Default: 'Quotes'
  
  GetQuoteFunctionName:
    Type: String
    Description: Name of the Lambda function to retrieve quotes
    Default: 'GetQuoteFunction'

Resources:
  # DynamoDB Table for Quotes
  QuotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref QuotesTableName
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: application_id
          Value: myapi

  # Lambda Execution Role
  QuoteLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountTwoId}:root'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt QuotesTable.Arn

  # Lambda Function to retrieve quotes
  GetQuoteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref GetQuoteFunctionName
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt QuoteLambdaExecutionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref QuotesTable
      Tags:
        - Key: application_id
          Value: myapi
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import logging
          from botocore.exceptions import ClientError
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          dynamodb = boto3.resource('dynamodb')
          table_name = os.environ['TABLE_NAME']
          table = dynamodb.Table(table_name)
          
          QUOTES = [
              "CORRECT",
              "You cannot change what you refuse to confront.",
              "Sometimes good things fall apart so better things can fall together.",
              "Don't think of cost. Think of value.",
              "Sometimes you need to distance yourself to see things clearly.",
              "Too many people buy things they don't need with money they don't have to impress people they don't know. Read Rich Dad, Poor Dad.",
              "No matter how many mistakes you make or how slow you progress, you are still way ahead of everyone who isn't trying.",
              "If a person wants to be a part of your life, they will make an obvious effort to do so. Think twice before reserving a space in your heart for people who do not make an effort to stay.",
              "Making one person smile can change the world – maybe not the whole world, but their world.",
              "Saying someone is ugly doesn't make you any prettier.",
              "The only normal people you know are the ones you don't know very well."
          ]
          
          def initialize_table():
              """Check if control record exists, if not, load all quotes"""
              try:
                  # Check if control record (id=0) exists
                  response = table.get_item(Key={'id': 0})
                  if 'Item' in response:
                      logger.info("Table already initialized")
                      return
                  
                  # Load all quotes
                  logger.info("Initializing table with quotes")
                  with table.batch_writer() as batch:
                      for i, quote in enumerate(QUOTES):
                          batch.put_item(Item={'id': i, 'quote': quote})
                  
                  logger.info("Table initialized successfully")
              except ClientError as e:
                  logger.error(f"Error initializing table: {e}")
                  raise
          
          def lambda_handler(event, context):
              logger.info(f"Event received: {json.dumps(event)}")
              
              # Initialize table if needed
              initialize_table()
              
              # Get the number from the event (1-10)
              quote_number = None
              
              # Handle different event formats
              if isinstance(event, dict):
                  if 'number' in event:
                      quote_number = event['number']
                  elif 'body' in event:
                      body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']
                      quote_number = body.get('number')
              
              if quote_number is None:
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'Missing number parameter (1-10)'})
                  }
              
              try:
                  quote_number = int(quote_number)
                  if quote_number < 1 or quote_number > 10:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'Number must be between 1 and 10'})
                      }
              except ValueError:
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'Invalid number format'})
                  }
              
              # Query DynamoDB
              try:
                  response = table.get_item(Key={'id': quote_number})
                  
                  if 'Item' not in response:
                      return {
                          'statusCode': 404,
                          'body': json.dumps({'error': 'Quote not found'})
                      }
                  
                  quote = response['Item']['quote']
                  logger.info(f"Retrieved quote {quote_number}: {quote}")
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps({'quote': quote})
                  }
              
              except ClientError as e:
                  logger.error(f"Error retrieving quote: {e}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': 'Failed to retrieve quote'})
                  }

  # Lambda Permission for cross-account invocation
  CrossAccountInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetQuoteFunction
      Action: lambda:InvokeFunction
      Principal: !Sub '${AccountTwoId}'

Outputs:
  QuotesTableName:
    Description: DynamoDB Quotes table name
    Value: !Ref QuotesTable
    Export:
      Name: !Sub '${AWS::StackName}-QuotesTable'
  
  GetQuoteFunctionArn:
    Description: ARN of the GetQuote Lambda function
    Value: !GetAtt GetQuoteFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GetQuoteFunctionArn'
  
  GetQuoteFunctionName:
    Description: Name of the GetQuote Lambda function
    Value: !Ref GetQuoteFunction
