AWSTemplateFormatVersion: '2010-09-09'
Description: 'CodePipeline for Quote of the Day - Cross-Account Deployment'

Parameters:
  GitHubRepo:
    Type: String
    Description: GitHub repository name (e.g., username/repo-name)
    Default: 'gxvigo/DevOpsAgent-LambdaTimeout'
  
  GitHubBranch:
    Type: String
    Description: GitHub branch to track
    Default: 'main'
  
  GitHubToken:
    Type: String
    Description: GitHub personal access token for CodePipeline
    NoEcho: true
  
  AccountOneId:
    Type: String
    Description: AWS Account ID for Account One
    Default: '757934432864'
  
  AccountTwoId:
    Type: String
    Description: AWS Account ID for Account Two (where pipeline runs)
    Default: '639930233929'

Resources:
  # KMS Key for S3 Bucket Encryption
  ArtifactBucketKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CodePipeline artifact bucket encryption
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Account One to use the key
            Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${AccountOneId}:root'
                - !Sub 'arn:aws:iam::${AccountOneId}:role/QuoteOfDay-CrossAccountDeploymentRole'
                - !Sub 'arn:aws:iam::${AccountOneId}:role/QuoteOfDay-CloudFormationRole-AccOne'
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
            Resource: '*'
      Tags:
        - Key: application_id
          Value: myapi

  ArtifactBucketKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/quote-of-day-pipeline-artifacts
      TargetKeyId: !Ref ArtifactBucketKey

  # S3 Bucket for Pipeline Artifacts
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'quote-of-day-pipeline-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt ArtifactBucketKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: application_id
          Value: myapi

  # S3 Bucket Policy to allow cross-account access
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Statement:
          - Sid: AllowPipelineAccess
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt PipelineRole.Arn
                - !Sub 'arn:aws:iam::${AccountOneId}:root'
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
          - Sid: AllowAccountOneAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountOneId}:role/QuoteOfDay-CrossAccountDeploymentRole'
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Resource: !Sub '${ArtifactBucket.Arn}/*'

  # CodePipeline Service Role
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodePipeline_FullAccess
      Policies:
        - PolicyName: PipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                Resource: !GetAtt ArtifactBucketKey.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeChangeSet
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt CloudFormationRoleAccountTwo.Arn
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub 'arn:aws:iam::${AccountOneId}:role/QuoteOfDay-CrossAccountDeploymentRole'
      Tags:
        - Key: application_id
          Value: myapi

  # CloudFormation Execution Role for Account Two (local)
  CloudFormationRoleAccountTwo:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuoteOfDay-CloudFormationRole-AccTwo
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: IAMPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                Resource: !Sub 'arn:aws:iam::${AccountTwoId}:role/quote-of-day-acc-two-*'
      Tags:
        - Key: application_id
          Value: myapi

  # CodePipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: QuoteOfDay-Pipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        # Source Stage
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              Configuration:
                Owner: !Select [0, !Split ['/', !Ref GitHubRepo]]
                Repo: !Select [1, !Split ['/', !Ref GitHubRepo]]
                Branch: !Ref GitHubBranch
                OAuthToken: !Ref GitHubToken
                PollForSourceChanges: true
              OutputArtifacts:
                - Name: SourceOutput

        # Deploy to Account One
        - Name: DeployAccountOne
          Actions:
            - Name: DeployAccOne
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: quote-of-day-acc-one
                TemplatePath: SourceOutput::acc-one-template.yaml
                Capabilities: CAPABILITY_IAM
                RoleArn: !Sub 'arn:aws:iam::${AccountOneId}:role/QuoteOfDay-CloudFormationRole-AccOne'
                ParameterOverrides: !Sub |
                  {
                    "AccountTwoId": "${AccountTwoId}",
                    "QuotesTableName": "Quotes",
                    "GetQuoteFunctionName": "GetQuoteFunction"
                  }
                OutputFileName: acc-one-outputs.json
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: AccOneOutputs
              RoleArn: !Sub 'arn:aws:iam::${AccountOneId}:role/QuoteOfDay-CrossAccountDeploymentRole'

        # Deploy to Account Two
        - Name: DeployAccountTwo
          Actions:
            - Name: DeployAccTwo
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: quote-of-day-acc-two
                TemplatePath: SourceOutput::acc-two-template.yaml
                Capabilities: CAPABILITY_IAM
                RoleArn: !GetAtt CloudFormationRoleAccountTwo.Arn
                ParameterOverrides: |
                  {
                    "AccountOneQuoteFunctionArn": "arn:aws:lambda:ap-southeast-2:757934432864:function:GetQuoteFunction",
                    "DeploymentVersion": "v4"
                  }
              InputArtifacts:
                - Name: SourceOutput
                - Name: AccOneOutputs
              RunOrder: 1
      Tags:
        - Key: application_id
          Value: myapi

Outputs:
  PipelineName:
    Description: Name of the CodePipeline
    Value: !Ref Pipeline
  
  ArtifactBucketName:
    Description: S3 bucket for pipeline artifacts
    Value: !Ref ArtifactBucket
  
  KMSKeyArn:
    Description: ARN of the KMS key for artifact encryption
    Value: !GetAtt ArtifactBucketKey.Arn
    Export:
      Name: QuoteOfDay-Pipeline-KMSKeyArn
  
  PipelineUrl:
    Description: URL to the CodePipeline console
    Value: !Sub 'https://console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}'
