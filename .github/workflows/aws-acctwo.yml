name: Deploy CloudFormation to Account Two

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_ACC_TWO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ACC_TWO }}
          aws-region: ap-southeast-2
      
      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file acc-two-template.yaml \
            --stack-name quote-of-day-acc-two \
            --parameter-overrides AccountOneQuoteFunctionArn=arn:aws:lambda:ap-southeast-2:757934432864:function:GetQuoteFunction \
            --capabilities CAPABILITY_IAM \
            --region ap-southeast-2
