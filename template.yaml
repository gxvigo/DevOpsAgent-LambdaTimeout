AWSTemplateFormatVersion: '2010-09-09'
Description: 'API Gateway + Lambda with CloudWatch Alarm for failures'

Resources:
  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda Function
  EchoLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: EchoFunction
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 3
      Tags:
        - Key: application_id
          Value: myapi
      Code:
        ZipFile: |
          import json
          import time
          import random
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event, context):
              # Get input string from query parameters
              query_params = event.get('queryStringParameters', {})
              input_string = query_params.get('input', '') if query_params else ''
              
              logger.info(f"Lambda invoked with input: {input_string}")
              
              # This will introduce random behaviou, not just succeed or failure. Fail ~1 in 3 invocations by sleeping longer than timeout
              # will_timeout = random.randint(1, 3) == 4
              will_timeout = 1

              # Set sleep_time to >3 to make the function fail
              sleep_time = 6
              if will_timeout:
                  logger.warning(f"Simulating timeout for input: {input_string}")
                  time.sleep(sleep_time)  # Exceeds 3 second timeout
              
              logger.info(f"Successfully processed input: {input_string}")
              
              return {
                  'statusCode': 200,
                  'headers': {
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps({
                      'echo': input_string
                  })
              }

  # Lambda Permission for API Gateway
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EchoLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EchoApi}/*/*

  # API Gateway REST API
  EchoApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: EchoAPI
      Description: API that echoes input string
      Tags:
        - Key: application_id
          Value: myapi

  # API Gateway Resource
  EchoResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref EchoApi
      ParentId: !GetAtt EchoApi.RootResourceId
      PathPart: echo

  # API Gateway Method
  EchoMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref EchoApi
      ResourceId: !Ref EchoResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EchoLambdaFunction.Arn}/invocations

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: EchoMethod
    Properties:
      RestApiId: !Ref EchoApi
      StageName: prod
      StageDescription:
        Tags:
          - Key: application_id
            Value: myapi

  # CloudWatch Alarm for Lambda Errors
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: EchoLambdaErrorAlarm
      AlarmDescription: Triggers when Lambda has more than 10 errors in 1 minute
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref EchoLambdaFunction
      TreatMissingData: notBreaching
      Tags:
        - Key: application_id
          Value: myapi

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${EchoApi}.execute-api.${AWS::Region}.amazonaws.com/prod/echo
  
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref EchoLambdaFunction
  
  AlarmName:
    Description: CloudWatch alarm name
    Value: !Ref LambdaErrorAlarm
